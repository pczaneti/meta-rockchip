require conf/machine/include/rv1106.inc

KERNEL_DEVICETREE = "rv1106g-luckfox-pico-ultra-w.dtb"

UBOOT_MACHINE = "luckfox_rv1106_uboot_defconfig"
RK_UBOOT_SPL = "1"


INHERIT:append = " rockchip-image"

PREFERRED_VERSION_linux-rockchip := "5.10%"
LINUXLIBCVERSION := "5.10-custom%"

SRC_URI:pn-linux-rockchip = " \
    git://github.com/pczaneti/kernel.git;protocol=https;branch=develop-5.10-luckfux-pico; \
    file://cgroups.cfg \
"
SRCREV:pn-linux-rockchip = "190bc3f5e1f67f9f92b9541643759173565f7075"

# KBRANCH = "HEAD"

# SRC_URI:pn-linux-libc-headers = " \
#         git://${TOPDIR}/../kernel;protocol=file;usehead=1 \
# "
# SRCREV:pn-linux-libc-headers = "${AUTOREV}"

SRC_URI:pn-u-boot-rockchip = " \
    git://github.com/LuckfoxTECH/luckfox-pico;protocol=https;branch=main;subpath=sysdrv/source/uboot/u-boot;subdir=git; \
    git://github.com/LuckfoxTECH/luckfox-pico;protocol=https;branch=main;name=rkbin;subpath=sysdrv/source/uboot/rkbin; \
"
SRCREV:pn-u-boot-rockchip = "d2da6f0f4fb6adbad65cee6e97f516a9483eab46"
SRCREV_rkbin:pn-u-boot-rockchip = "d2da6f0f4fb6adbad65cee6e97f516a9483eab46"
